name: psdku
services:
  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    ports:
      - 3000:3000
    environment:
      - DB_HOST=product-db
      - DB_USER=appuser
      - DB_PASSWORD=apppassword
      - DB_NAME=productdb
    depends_on:
      product-db:
        condition: service_healthy
  
  product-db:
    image: mysql:8.0
    environment:
      - MYSQL_DATABASE=productdb
      - MYSQL_USER=appuser
      - MYSQL_PASSWORD=apppassword
      - MYSQL_ROOT_PASSWORD=rootpassword
    volumes:
      - product-db-data:/var/lib/mysql
      - ./product-service/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--user=root", "--password=rootpassword"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 5s

  
  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    ports:
      - "3003:3003"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:3003
      APP_KEY: ${ORDER_APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: order-db
      DB_PORT: 3306
      DB_DATABASE: orderdb
      DB_USERNAME: appuser
      DB_PASSWORD: orderpassword
      SESSION_DRIVER: file
    depends_on:
      order-db:
        condition: service_healthy

  order-db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: orderdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: orderpassword
      MYSQL_ROOT_PASSWORD: orderrootpassword
    volumes:
      - order-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--user=root", "--password=orderrootpassword"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 5s


volumes:
  product-db-data:
  order-db-data: